CONFIG_ZTEST=y
CONFIG_BT=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_EMUL=y
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
CONFIG_ZTEST_THREAD_PRIORITY=-1
# Model an ISR: the test must not preempt a UART callback mid-transfer.
CONFIG_UART_EMUL_WORK_Q_PRIORITY=-2
