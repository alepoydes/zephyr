common:
  tags:
    - drivers
    - uart
    - gpio
    - userspace
  platform_allow:
    - mps2/an385
  harness: ztest
  filter: CONFIG_ARCH_HAS_USERSPACE

tests:
  drivers.userspace_access.default_enabled:
  drivers.userspace_access.disabled:
    extra_configs:
      - CONFIG_UART_USERSPACE=n
      - CONFIG_GPIO_USERSPACE=n
    extra_args: EXTRA_CPPFLAGS=-DTEST_DRIVER_USERSPACE_DISABLED=1
    ignore_faults: true
